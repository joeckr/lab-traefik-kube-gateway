traefik:
  deployment:
    enabled: true
    kind: DaemonSet

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

  service:
    enabled: true
    single: true
    spec:
      type: LoadBalancer

  ingressClass:
    enabled: false
    isDefaultClass: false

  ports:
    web:
      forwardedHeaders:
        trustedIPs:
          - "10.244.0.0/16"

  gateway:
    enabled: true
    listeners:
      web:
        port: 8000
        protocol: HTTP
        namespacePolicy:
          from: All

  gatewayClass:
    enabled: true

  providers:
    kubernetesCRD:
      enabled: false
    kubernetesIngress:
      enabled: false
    kubernetesGateway:
      enabled: true
      statusAddress:
        service:
          enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 90Mi
    limits:
      cpu: 500m
      memory: 256Mi

  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
